---
# Generate Ansible playbook via RHEL AI / MaaS OpenAI-compatible chat API.
# Inputs (AAP survey / extra_vars) — only these three + lightspeed_prompt:
#
#   rhelai_server: https://maas-rhdp.apps.maas.redhatworkshops.io/chat/completions
#   rhelai_token: <Bearer / sk-...>
#   rhelai_model_name: claude-sonnet-4-6
#   lightspeed_prompt: <natural language request>
#
# Do not commit real tokens to git — set rhelai_token in AAP Credential / survey.

- name: Generate Ansible Playbook with RHEL AI
  hosts: localhost
  gather_facts: false
  vars:
    rhelai_server: "{{ rhelai_server | default('https://maas-rhdp.apps.maas.redhatworkshops.io/chat/completions') }}"
    rhelai_model_name: "{{ rhelai_model_name | default('claude-sonnet-4-6') }}"
    _prompt: "{{ lightspeed_prompt | default('') }}"
    _system_prompt: >-
      You are an Ansible expert. Reply with ONLY a valid Ansible playbook in YAML.
      No markdown fences, no explanation before or after the YAML.

  tasks:
    - name: Validate required inputs
      ansible.builtin.assert:
        that:
          - rhelai_server is defined and (rhelai_server | length) > 0
          - rhelai_token is defined and (rhelai_token | length) > 0
          - rhelai_model_name is defined and (rhelai_model_name | length) > 0
          - _prompt | length > 0
        fail_msg: >-
          Need rhelai_server (full chat/completions URL), rhelai_token,
          rhelai_model_name, and lightspeed_prompt.

    - name: Send request to RHEL AI / MaaS chat completions
      ansible.builtin.uri:
        url: "{{ rhelai_server }}"
        method: POST
        headers:
          accept: "application/json"
          Content-Type: "application/json"
          Authorization: "Bearer {{ rhelai_token }}"
        body_format: json
        body:
          model: "{{ rhelai_model_name }}"
          temperature: 0.2
          max_tokens: 2048
          messages:
            - role: system
              content: "{{ _system_prompt }}"
            - role: user
              content: "{{ _prompt }}"
        return_content: true
        status_code: 200
        timeout: 180
        validate_certs: true
      register: rhelai_response
      no_log: true

    - name: Extract model text
      ansible.builtin.set_fact:
        _raw_content: >-
          {{
            rhelai_response.json.choices[0].message.content
            if (rhelai_response.json.choices[0].message is defined)
            else rhelai_response.json.choices[0].text
          }}

    - name: Strip markdown code fences if present
      ansible.builtin.set_fact:
        lightspeed_playbook_raw: >-
          {{
            _raw_content
            | regex_replace('(?s)^\\s*```(?:ya?ml)?\\s*', '')
            | regex_replace('(?s)\\s*```\\s*$', '')
            | trim
          }}

    - name: Display generated playbook
      ansible.builtin.debug:
        msg: "{{ lightspeed_playbook_raw }}"

    - name: Set stats for downstream workflow nodes
      ansible.builtin.set_stats:
        data:
          lightspeed_playbook: "{{ lightspeed_playbook_raw }}"
