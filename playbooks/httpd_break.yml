---
- name: Add bad directive under in Apache configuration
  hosts: all
  become: true
  vars:
    # Tunable for troubleshooting "Server unreachable" / slow SSH
    httpd_break_sleep_seconds: 30

  tasks:
    - name: Wait for SSH / connection (troubleshoot unreachable)
      ansible.builtin.wait_for_connection:
        timeout: 120

    - name: Sleep before changes (troubleshoot unreachable / race)
      ansible.builtin.pause:
        seconds: "{{ httpd_break_sleep_seconds }}"
      # pause shows countdown in job output; use sleep module if preferred:
      # ansible.builtin.command: "sleep {{ httpd_break_sleep_seconds }}"

    - name: Ensure Apache is installed
      ansible.builtin.dnf:
        name: httpd
        state: present
      notify:
        - Restart apache

    - name: Add InvalidDirectiveHere
      ansible.builtin.lineinfile:
        path: /etc/httpd/conf/httpd.conf
        insertafter: '^ServerRoot'
        line: 'InvalidDirectiveHere'
        state: present
      notify:
        - Restart apache

    - name: Sleep after config change (allow logs / EDA to settle)
      ansible.builtin.pause:
        seconds: "{{ httpd_break_sleep_seconds }}"

  handlers:
    - name: Restart apache
      ansible.builtin.service:
        name: httpd
        state: restarted
      register: httpd_restart_result
      failed_when: "'Job for httpd.service failed' not in httpd_restart_result.msg | default('')"
