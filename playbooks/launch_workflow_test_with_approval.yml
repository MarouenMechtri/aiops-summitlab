---
# Wrapper playbook: Automation Portal cannot expose Workflow Job Templates.
# Expose THIS playbook as a Job Template with a survey (vpc_name, test).
# It launches the workflow "test with approval", which runs the playbook
# that consumes those survey variables (e.g. Cloud/AWS Create VPC).
#
# Job Template setup (Controller):
#   - Inventory: localhost / Demo Inventory (or any inventory with localhost)
#   - Credential: Red Hat Ansible Automation Platform (API access)
#   - Survey enabled:
#       vpc_name  (text)           — e.g. question "Enter a name for the AWS VPC"
#       test      (multiple choice) — e.g. Yes / No
#   - Extra variables prompt: optional (survey vars are enough)

- name: Launch workflow "test with approval" (Portal wrapper)
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    workflow_name: "test with approval"
    workflow_organization: Default
    # Survey / extra_vars from the Job Template (Portal form)
    vpc_name: "{{ vpc_name | default('my_vpc') }}"
    test: "{{ test | default('Yes') }}"
    wait_for_workflow: true
    workflow_timeout_seconds: 3600

  tasks:
    - name: Validate required survey variables
      ansible.builtin.assert:
        that:
          - vpc_name is defined and (vpc_name | length) > 0
          - test is defined and (test | string | length) > 0
        fail_msg: >-
          Survey variables vpc_name and test are required.
          Configure them on the Job Template survey (Portal form).

    - name: Show launch parameters
      ansible.builtin.debug:
        msg:
          workflow: "{{ workflow_name }}"
          organization: "{{ workflow_organization }}"
          vpc_name: "{{ vpc_name }}"
          test: "{{ test }}"

    - name: Launch workflow job template
      ansible.controller.workflow_launch:
        name: "{{ workflow_name }}"
        organization: "{{ workflow_organization }}"
        wait: "{{ wait_for_workflow }}"
        timeout: "{{ workflow_timeout_seconds }}"
        validate_certs: "{{ controller_verify_ssl | default(omit) }}"
        extra_vars:
          vpc_name: "{{ vpc_name }}"
          test: "{{ test }}"
      register: workflow_launch
      # Auth: attach an AAP / Controller credential to the Job Template
      # (sets CONTROLLER_HOST + CONTROLLER_USERNAME/PASSWORD or OAuth token).

    - name: Show workflow result
      ansible.builtin.debug:
        msg:
          status: "{{ workflow_launch.status | default('launched') }}"
          id: "{{ workflow_launch.id | default(workflow_launch.job | default('n/a')) }}"
          url: "{{ workflow_launch.url | default('n/a') }}"
